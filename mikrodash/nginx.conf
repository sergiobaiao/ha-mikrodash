pid /run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  access_log off;
  default_type application/octet-stream;
  include /etc/nginx/mime.types;

  map $http_upgrade $conn_upgrade { default upgrade; '' close; }
  # O app compara Origin com Host: usa o host que o navegador usou.
  map $http_origin $origin_host { ~^https?://(?<h>[^/]+)$ $h; default $http_host; }

  server {
    listen 8099;
    absolute_redirect off;
    allow 172.30.32.2;   # Supervisor ingress
    deny all;

    location = /__ingress.js { alias /etc/nginx/ingress.js; default_type application/javascript; }

    location / {
      proxy_pass http://127.0.0.1:3081;
      proxy_http_version 1.1;
      proxy_set_header Host $origin_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $conn_upgrade;
      proxy_set_header Accept-Encoding "";
      proxy_read_timeout 3600s;
      proxy_redirect ~^/(.*)$ $http_x_ingress_path/$1;

      sub_filter_once off;
      sub_filter_types text/css text/javascript application/javascript;
      sub_filter '<head>' '<head><script src="$http_x_ingress_path/__ingress.js"></script>';
      sub_filter 'location.replace(safeNext())' 'location.replace(window.__ingressFix(safeNext()))';
      sub_filter 'href="/' 'href="$http_x_ingress_path/';
      sub_filter 'src="/' 'src="$http_x_ingress_path/';
      sub_filter 'href = "/' 'href = "$http_x_ingress_path/';
      sub_filter "href = '/" "href = '$http_x_ingress_path/";
      sub_filter "href='/" "href='$http_x_ingress_path/";
      sub_filter 'url(/' 'url($http_x_ingress_path/';
      sub_filter 'url("/' 'url("$http_x_ingress_path/';
      sub_filter "url('/" "url('$http_x_ingress_path/";
    }
  }
}
